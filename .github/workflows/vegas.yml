name: 维加斯通道提醒

# 设计说明（防止时间断档）：
# 1) 每小时由 cron 叫醒一次；同时 job 自己在结束前「交班」——调用 API 触发下一次，
#    所以即使 cron 被 GitHub 限流，链条也不会断。
# 2) 另有一个「看门狗」workflow（watchdog.yml），发现超过 25 分钟没有新运行就补一次。
# 3) 每个 job 常驻约 5 小时 45 分，内部每 4 分钟检查一轮。

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: '自动化链路调用时传 true'
        default: 'false'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: vegas-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装绘图库
        run: pip install --no-cache-dir pillow

      - name: 单轮检查（手动触发 / 看门狗补跑）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.chain != 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SYMBOLS: BTCUSDT,SNDKUSDT,XAUUSD,SOXLBUSDT
          INTERVALS: 15m,1h,4h,1d,1w
          MAX_DELAY_MIN: '20'
        run: python vegas_alert.py --once

      - name: 常驻检查（每 4 分钟一轮，跑约 5 小时 45 分）
        if: github.event_name == 'schedule' || github.event.inputs.chain == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SYMBOLS: BTCUSDT,SNDKUSDT,XAUUSD,SOXLBUSDT
          INTERVALS: 15m,1h,4h,1d,1w
          MAX_DELAY_MIN: '20'
        run: |
          git config user.name "vegas-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS + 20700))   # 345 分钟
          i=0
          while [ $SECONDS -lt $end ]; do
            python vegas_alert.py --once || true
            i=$((i + 1))
            if [ $((i % 10)) -eq 0 ] && [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -m "chore: update alert state [skip ci]" || true
              git push || true
            fi
            sleep 210
          done

      - name: 保存已评估的 K 线状态
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vegas-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update alert state [skip ci]" || true
            git push || true
          else
            echo "state.json 无变化"
          fi

      - name: 交班（自己触发下一班，保证不断档）
        if: always() && (github.event_name == 'schedule' || github.event.inputs.chain == 'true')
        run: |
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vegas.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"true"}}')
          echo "交班请求返回：$code"
          cat /tmp/resp.json || true
