name: 维加斯通道提醒

# GitHub 会把「每 5 分钟」的定时任务严重限流（实测被压到 3~8 小时一次），
# 所以改成：每小时叫醒一次 → 唤醒后这个 job 自己常驻约 5 小时 45 分，
# 内部每 4 分钟检查一轮。这样等于近乎 7×24 连续监控，而且仍然是免费额度。

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vegas-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装绘图库
        run: pip install --no-cache-dir pillow

      - name: 手动触发（只跑一轮）
        if: github.event_name == 'workflow_dispatch'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SYMBOLS: BTCUSDT,SNDKUSDT,XAUUSD,SOXLBUSDT
          INTERVALS: 15m,1h,4h,1d,1w
          MAX_DELAY_MIN: '20'
        run: python vegas_alert.py --once

      - name: 常驻检查（每 4 分钟一轮，跑约 5 小时 45 分）
        if: github.event_name == 'schedule'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SYMBOLS: BTCUSDT,SNDKUSDT,XAUUSD,SOXLBUSDT
          INTERVALS: 15m,1h,4h,1d,1w
          MAX_DELAY_MIN: '20'
        run: |
          git config user.name "vegas-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS + 20700))   # 345 分钟
          i=0
          while [ $SECONDS -lt $end ]; do
            python vegas_alert.py --once || true
            i=$((i + 1))
            # 每 10 轮（≈40 分钟）把状态提交一次，防止 job 被中断丢掉进度
            if [ $((i % 10)) -eq 0 ] && [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -m "chore: update alert state [skip ci]" || true
              git push || true
            fi
            sleep 210
          done

      - name: 保存已评估的 K 线状态
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vegas-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update alert state [skip ci]" || true
            git push || true
          else
            echo "state.json 无变化"
          fi
